server:
  port: 8082

spring:
  application:
    name: transaction-service
  config:
    import: "optional:configserver:http://localhost:9999"
  datasource:
    url: jdbc:h2:mem:transaction-db
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  graphql:
    graphiql:
      enabled: true
  ai:
    mcp:
      server:
        protocol: streamable
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
    discovery:
      enabled: false
    config:
      enabled: false

bank:
  transaction:
    max-amount: 1000